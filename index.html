<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Elysean</title>
  <meta name="description" content="The Elysean — built on Volta on Elysium. 2% trading fee used to buy back and burn." />
  <meta name="theme-color" content="#070b14" />
  <meta property="og:title" content="The Elysean" />
  <meta property="og:description" content="Built on Volta on Elysium. 2% trading fee used to buy back and burn." />
  <meta property="og:image" content="assets/hero-poster.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@theelysean" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Urbanist:wght@600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero">
    <!-- Background video: assets/hero.webm / hero.mp4, poster shown until it plays. -->
    <div class="hero-media" aria-hidden="true">
      <video class="hero-video" autoplay muted loop playsinline preload="auto" poster="assets/hero-poster.jpg">
        <source src="assets/hero.webm" type="video/webm" />
        <source src="assets/hero.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="hero-shade" aria-hidden="true"></div>

    <header class="nav">
      <div class="built-on">
        <a href="https://www.volta.family/" target="_blank" rel="noopener" aria-label="Built on Volta">
            <span class="built-label">Built on</span>
            <span class="volta"><span>V</span><span class="volta-o"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="4.5"/><path d="M20 1 L22.6 17.4 L39 20 L22.6 22.6 L20 39 L17.4 22.6 L1 20 L17.4 17.4 Z" fill="#eafff4"/></svg></span><span>LTA</span></span>
          </a>
      </div>
      <a class="x-link" href="https://x.com/theelysean" target="_blank" rel="noopener" aria-label="Elysean on X">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/></svg>
      </a>
    </header>

    <section class="content">
      <h1 class="title">
        <span class="title-text">The Elysean</span>
        <span class="title-reflect" aria-hidden="true">The Elysean</span>
      </h1>
      <!-- Vertical-only blur that turns the reflection into light streaks -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="streak" x="-5%" y="-20%" width="110%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="0.5 9" />
        </filter>
      </svg>

      <div class="burn-card" id="burn">
        <div class="burn-head">
          <svg class="flame" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5c.6 3.4-1.6 5.3-3.3 7.4C7.4 11.5 6.5 13 6.5 15a5.5 5.5 0 0 0 11 0c0-2.6-1.3-4.5-2.7-6-.1 1.6-.7 2.8-1.8 3.4.4-3.6-.3-6.9-1-9.9Z"/><path d="M12 21a2.6 2.6 0 0 1-2.6-2.6c0-1.6 1.3-2.5 2.2-3.8.3 1 .9 1.6 1.6 2 .9.5 1.4 1 1.4 1.8A2.6 2.6 0 0 1 12 21Z" fill="currentColor" fill-opacity=".35"/></svg>
          <span>Total Burnt</span>
          <span class="fee-chip">2% buyback &amp; burn</span>
        </div>
        <div class="burn-value" id="burn-value" aria-live="polite">0</div>
        <div class="burn-unit">ELYSEAN</div>
        <svg class="burn-chart" id="burn-chart" viewBox="0 0 600 140" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="burnFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5fe0a8" stop-opacity=".35" />
              <stop offset="1" stop-color="#5fe0a8" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="burnStroke" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#2f8f69" />
              <stop offset="1" stop-color="#7cf5c0" />
            </linearGradient>
          </defs>
          <path id="burn-area" fill="url(#burnFill)" d="" />
          <path id="burn-line" fill="none" stroke="url(#burnStroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" d="" />
        </svg>
        <dl class="stats">
          <div class="stat"><dt>Market Cap</dt><dd id="stat-mc">—</dd></div>
          <div class="stat"><dt>24h Volume</dt><dd id="stat-vol">—</dd></div>
          <div class="stat"><dt>Holders</dt><dd id="stat-holders">—</dd></div>
        </dl>
        <p class="fee-note">
          Every trade carries a <strong>2% fee</strong>. All of it is used to <strong>buy back $ELYSEAN</strong> from the market and <strong>burn</strong> it, so supply only goes down.
        </p>
      </div>

      <div class="ca" id="ca">
        <span class="ca-label">CA</span>
        <code class="ca-value" id="ca-value">Coming soon</code>
        <button class="ca-copy" id="ca-copy" type="button" disabled>Copy</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
